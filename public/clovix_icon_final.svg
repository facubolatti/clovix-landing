<svg width="500" height="500" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Clovix icon</title>
  <desc>Ícono de nodo central de Clovix con 6 conexiones</desc>

  <!-- 6 spoke lines -->
  <line x1="340" y1="340" x2="340" y2="115" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="340" x2="543" y2="225" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="340" x2="543" y2="455" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="340" x2="340" y2="565" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="340" x2="137" y2="455" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="340" x2="137" y2="225" stroke="#3B6FE8" stroke-width="5" stroke-linecap="round"/>

  <!-- 6 outer nodes -->
  <circle cx="340" cy="95" r="22" fill="#7B5CF0"/>
  <circle cx="558" cy="215" r="18" fill="#3B6FE8"/>
  <circle cx="558" cy="465" r="18" fill="#3B6FE8"/>
  <circle cx="340" cy="585" r="22" fill="#7B5CF0"/>
  <circle cx="122" cy="465" r="18" fill="#3B6FE8"/>
  <circle cx="122" cy="215" r="18" fill="#3B6FE8"/>

  <!-- Center halo layers -->
  <circle cx="340" cy="340" r="90" fill="#3B6FE8" fill-opacity="0.08"/>
  <circle cx="340" cy="340" r="74" fill="#3B6FE8" fill-opacity="0.12"/>
  <circle cx="340" cy="340" r="62" fill="white" stroke="#3B6FE8" stroke-width="7"/>
  <circle cx="340" cy="340" r="30" fill="#3B6FE8"/>
</svg>
